name: diag runner disk

# Prints the real disk/RAM layout of the hosted runner, before and after a cleanup, as check-run annotations.
on:
  workflow_dispatch:

jobs:
  d:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: before cleanup
        run: |
          {
            echo "== runner"; uname -r; nproc; free -m | sed -n 1,2p
            echo "== df"; df -h -x tmpfs -x devtmpfs -x squashfs
            echo "== lsblk"; lsblk -o NAME,SIZE,TYPE,MOUNTPOINT
            echo "== swap"; swapon --show
            echo "== big dirs (GB)"
            for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/lib/node_modules /var/lib/docker /usr/lib/jvm /opt/microsoft /usr/local/.ghcup /usr/share/swift /usr/local/julia* /home/runner /opt/az /usr/local/share/chromium /usr/local/lib/python3*; do
              [ -e "$d" ] && sudo du -s -BG "$d" 2>/dev/null
            done
          } > /tmp/before.txt 2>&1
          echo "::notice title=before cleanup::$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/before.txt | head -c 60000)"
      - name: after cleanup
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/local/.ghcup /usr/share/swift /opt/az /usr/local/julia* /usr/local/share/chromium 2>/dev/null
          sudo docker system prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          {
            echo "== df after cleanup"; df -h -x tmpfs -x devtmpfs -x squashfs
            echo "== /mnt"; df -h /mnt; ls -la /mnt | head
          } > /tmp/after.txt 2>&1
          echo "::notice title=after cleanup::$(sed ':a;N;$!ba;s/\n/%0A/g' /tmp/after.txt | head -c 60000)"
